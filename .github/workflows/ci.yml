# Continuous integration. Runs on every pull request and every push to main.
#
# Vercel builds and deploys on its own, but it does not run the tests, so this workflow does. It uses no secrets, and
# the test suite blocks all network access (shared/testing/offline.ts), so CI cannot spend model credits.
# Post-deploy checks are separate: run `npm run smoke -- <url>` after a deployment (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (exact versions from the lockfile)
        run: npm ci --no-audit --no-fund
      - name: Lint (errors fail the build; warnings are reported)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (offline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
